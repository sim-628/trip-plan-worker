name = "trip-plan-worker"
main = "src/index.ts"
compatibility_date = "2026-11-11"
compatibility_flags = ["nodejs_compat"]

[vars]
APP_ENV = "production"
# Set ALLOWED_ORIGIN to your app's API origin if browser clients will call this Worker.
ALLOWED_ORIGIN = "*"
DIDA_API_BASE_URL = "https://didatickettest.wysiwysi.com/api/distribution/v1"
DIDA_ACCEPT_LANGUAGE = "en"

# Configure secrets with:
# npx wrangler secret put GOOGLE_MAPS_API_KEY
# npx wrangler secret put APP_API_TOKEN
# npx wrangler secret put IOS_GATEWAY_TOKEN
# npx wrangler secret put OPENAI_API_KEY
# npx wrangler secret put TRAVEL_OPENAI_API_KEY # project containing agents/manifest.json IDs
# npx wrangler secret put DIDA_API_TOKEN

[[durable_objects.bindings]]
name = "TRAVEL_SESSIONS"
class_name = "TravelSessionCoordinator"

[[migrations]]
tag = "travel-agents-v1"
new_sqlite_classes = ["TravelSessionCoordinator"]

[observability]
enabled = true
